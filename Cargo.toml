[package]
name = "gray-recall"
license = "MIT"
description = "Search past gray sessions for ranked, cited prior work"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
strsim = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
name = "gray_recall"
path = "src/lib.rs"

[[bin]]
name = "gray-recall"
path = "src/main.rs"

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
