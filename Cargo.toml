[package]
name = "gray-recall"
license = "MIT"
description = "Search past gray sessions: ranked, cited turns (wire v1.1)."
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
strsim = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
name = "gray_recall"
path = "src/lib.rs"

[[bin]]
name = "gray-recall"
path = "src/main.rs"

[profile.release]
strip = true
